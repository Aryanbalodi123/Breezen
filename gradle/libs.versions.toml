[versions]
# Build Tools
agp = "8.13.1"
kotlin = "2.1.0"
googleGmsGoogleServices = "4.4.2"

# BOMs (Bill of Materials)
composeBom = "2024.10.01"    # Use slightly older Compose BOM compatible with Haze 0.7.3
supabaseBom = "3.2.6"
firebaseBom = "34.5.0"

# AndroidX Core
coreKtx = "1.17.0"
lifecycleRuntimeKtx = "2.9.4"
activityCompose = "1.11.0"
navigationCompose = "2.9.6"
media3 = "1.8.0"
paletteKtx = "1.0.0"

# UI & Image Loading
coilCompose = "2.7.0"
lottieCompose = "6.6.7"
# blurview = "2.0.3" ⬅️ DELETED - No longer needed, as it's a legacy View system dependency.
haze = "1.6.0"      # ⬅️ UPDATED from "0.5.2" to "1.6.0" for modern Compose compatibility.

# Networking
retrofit = "3.0.0"
okhttp = "4.12.0"
gson = "2.10.1"

# Coroutines & Serialization
kotlinxCoroutines = "1.9.0"
kotlinxSerializationJson = "1.7.3"

# Testing
junit = "4.13.2"
androidxJunit = "1.2.1"
espressoCore = "3.6.1"
material3 = "1.4.0"
foundation = "1.9.5"
animationCore = "1.9.5"
ui = "1.9.5"
places = "5.1.1"
uiText = "1.9.5"
animationCoreVersion = "1.10.0"

[libraries]
# --- ANDROIDX CORE & LIFECYCLE ---
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-palette-ktx = { module = "androidx.palette:palette-ktx", version.ref = "paletteKtx" }

# --- COMPOSE BOM & LIBRARIES ---
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-animation = { module = "androidx.compose.animation:animation" }
androidx-compose-animation-core = { module = "androidx.compose.animation:animation-core" }
androidx-foundation = { module = "androidx.compose.foundation:foundation" }

# --- NAVIGATION ---
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-navigation-testing = { module = "androidx.navigation:navigation-testing", version.ref = "navigationCompose" }

# --- SUPABASE BOM & LIBRARIES ---
supabase-bom = { module = "io.github.jan-tennert.supabase:bom", version.ref = "supabaseBom" }
supabase-auth = { module = "io.github.jan-tennert.supabase:gotrue-kt" }
ktor-client-android = { module = "io.ktor:ktor-client-android" }

# --- FIREBASE BOM & LIBRARIES ---
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore" }

# --- UI & VISUALS ---
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coilCompose" }
lottie-compose = { module = "com.airbnb.android:lottie-compose", version.ref = "lottieCompose" }
# blurview = { module = "com.github.Dimezis:BlurView", version.ref = "blurview" } ⬅️ DELETED
haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }

# --- MEDIA3 ---
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
androidx-media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }

# --- NETWORKING ---
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

# --- COROUTINES & SERIALIZATION ---
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

# --- TESTING ---
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "foundation" }
androidx-animation-core = { group = "androidx.compose.animation", name = "animation-core", version.ref = "animationCore" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "ui" }
places = { group = "com.google.android.libraries.places", name = "places", version.ref = "places" }
androidx-compose-ui-text = { group = "androidx.compose.ui", name = "ui-text", version.ref = "uiText" }
animation-core = { group = "androidx.compose.animation", name = "animation-core", version.ref = "animationCoreVersion" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
google-gms-google-services = { id = "com.google.gms.google-services", version.ref = "googleGmsGoogleServices" }

[bundles]
compose = [
    "androidx-ui",
    "androidx-ui-graphics",
    "androidx-ui-tooling-preview",
    "androidx-material3",
    "androidx-material-icons-extended",
    "androidx-foundation",
    "androidx-compose-animation",
]
coroutines = ["kotlinx-coroutines-core", "kotlinx-coroutines-android"]
media3 = ["androidx-media3-exoplayer", "androidx-media3-ui", "androidx-media3-common"]
testing-unit = ["junit", "kotlinx-coroutines-test"]
testing-android = ["androidx-junit", "androidx-espresso-core", "androidx-ui-test-junit4", "androidx-navigation-testing"]