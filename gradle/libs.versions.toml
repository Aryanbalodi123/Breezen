# Testing
junit = "4.13.2"  # Latest
junitVersion = "1.2.1"  # Latest
espressoCore = "3.6.1"  # Latest

# Firebase
googleGmsGoogleServices = "4.4.2"  # Latest
firebaseFirestore = "25.1.2"  # Latest

# Compose Compiler (required for Kotlin 2.0+)
composeCompiler = "1.5.15"  # Latest stable Compose Compiler

# Material Design
loggingInterceptor = "4.12.0"
