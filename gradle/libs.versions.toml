[versions]
# Note: Accompanist Pager is deprecated, use Compose Foundation Pager instead
accompanistPager = "0.34.0"  # Latest but deprecated
agp = "8.8.2"  # Updated Android Gradle Plugin

androidxComposeBom = "2025.08.00"
blurview = "version-2.0.6"
coilCompose = "2.7.0"  # Updated from 2.2.2
composeBomVersion = "2024.05.00"
converterGson = "2.11.0"
converterGsonVersion = "2.9.0"
foundation = "1.9.0"
gson = "2.10.1"
haze = "1.6.3"
json = "20240303"
